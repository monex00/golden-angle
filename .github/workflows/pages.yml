name: pages

# The browser page is the only thing published. It is rebuilt from the notebook
# on every push, so what runs in Pyodide can never drift from fractal_tree.py.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Guard the notebook
        # Runs every cell headless: a broken cell fails here, not in the browser.
        run: uv run python -c "import fractal_tree; fractal_tree.app.run()"
      - name: Export the page
        # --no-sandbox: the notebook has inline PEP 723 deps, and without it
        # marimo stops to ask whether to use a sandboxed venv.
        run: |
          uv run marimo export html-wasm fractal_tree.py -o site/ --mode run --no-sandbox
          rm -f site/CLAUDE.md
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
